<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login Dieta App</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
    h1 { margin-bottom: 30px; }
  </style>
</head>
<body>
  <h1>Login con Google</h1>
  
  <!-- Google One Tap / Sign In Button -->
  <div id="g_id_onload"
       data-client_id="293316408307-gdtm6pu9hqib8i7fbmnb1q9sva7c0k9p.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  
  <div class="g_id_signin" data-type="standard"></div>

  <script>
    // Funzione di callback chiamata da Google dopo il login
    function handleCredentialResponse(response) {
      if (!response.credential) {
        alert("Errore: nessun token ricevuto.");
        return;
      }

      console.log("Token ID Google:", response.credential);

      // Decodifica semplice del token JWT per ottenere nome e email
      function parseJwt(token) {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      }

      const userData = parseJwt(response.credential);
      console.log("Dati utente:", userData);

      alert(`Login avvenuto! Benvenuto ${userData.name}`);

      // Invia dati al webhook n8n
      fetch("https://piteroni.app.n8n.cloud/webhook-test/661ac583-3dce-439d-92bf-a2750283b882", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nome: userData.name,
          email: userData.email
        })
      })
      .then(res => res.json())
      .then(data => console.log("Risposta n8n:", data))
      .catch(err => console.error("Errore invio webhook:", err));
    }
  </script>
</body>
</html>
